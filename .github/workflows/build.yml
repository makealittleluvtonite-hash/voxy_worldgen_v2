name: Build Voxy World Gen V2

on:
  workflow_dispatch:
  push:
    branches:
      - "1211"

jobs:
  build:
    name: Build Minecraft 1.21.1 Fabric JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: 1211

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Show build output
        run: ls -lah build/libs

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: voxy-worldgen-v2-1.21.1-fabric
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
